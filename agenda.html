<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Agenda - ESCOM</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Barra de navegación -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <img src="https://www.escom.ipn.mx/images/logoESCOM.png" alt="Logo ESCOM" class="navbar-logo">
                <span>Gestor de Agenda</span>
            </div>
            <ul class="navbar-menu">
                <li><a href="#" class="navbar-link"><i class="fas fa-home"></i> Inicio</a></li>
                <li><a href="#" class="navbar-link"><i class="fas fa-calendar-alt"></i> Agenda</a></li>
                <li><a href="#" class="navbar-link"><i class="fas fa-bell"></i> Notificaciones</a></li>
                <li><a href="#" class="navbar-link profile-link"><i class="fas fa-user"></i> Perfil</a></li>
            </ul>
        </div>
    </nav>

    <!-- Contenido principal -->
    <div class="container">
        <header>
            <h1><i class="fas fa-calendar-alt"></i> Gestión de Agenda</h1>
            <p>Organiza eventos, fechas importantes y sesiones académicas</p>
        </header>

        <!-- Controles de agenda -->
        <div class="agenda-controls">
            <div class="filter-group">
                <label for="filtro-fecha">Filtrar por:</label>
                <select id="filtro-fecha" class="form-select">
                    <option value="todos">Todos los eventos</option>
                    <option value="hoy">Hoy</option>
                    <option value="semana">Esta semana</option>
                    <option value="mes">Este mes</option>
                    <option value="proximos">Próximos 7 días</option>
                </select>
            </div>
            <button id="btn-nuevo-evento" class="btn-submit"><i class="fas fa-plus"></i> Nuevo Evento</button>
        </div>

        <!-- Vista de calendario -->
        <div class="calendar-view">
            <div class="calendar-header">
                <button id="btn-mes-anterior" class="btn-calendar-nav"><i class="fas fa-chevron-left"></i></button>
                <h2 id="mes-actual">Junio 2023</h2>
                <button id="btn-mes-siguiente" class="btn-calendar-nav"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="calendar-grid" id="calendar-grid">
                <!-- Los días se generan dinámicamente con JavaScript -->
            </div>
        </div>

        <!-- Lista de eventos -->
        <div class="events-section">
            <h2><i class="fas fa-list"></i> Eventos Programados</h2>
            <div class="events-list" id="events-list">
                <!-- Los eventos se generan dinámicamente con JavaScript -->
            </div>
        </div>

        <!-- Modal para nuevo evento -->
        <div id="evento-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modal-titulo">Nuevo Evento</h3>
                    <span class="close-modal">&times;</span>
                </div>
                <div class="modal-body">
                    <form id="evento-form">
                        <div class="form-group">
                            <label for="evento-titulo">Título del Evento</label>
                            <input type="text" id="evento-titulo" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label for="evento-descripcion">Descripción</label>
                            <textarea id="evento-descripcion" class="form-textarea" rows="3"></textarea>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="evento-fecha">Fecha</label>
                                <input type="date" id="evento-fecha" class="form-input" required>
                            </div>
                            <div class="form-group">
                                <label for="evento-hora-inicio">Hora de inicio</label>
                                <input type="time" id="evento-hora-inicio" class="form-input" required>
                            </div>
                            <div class="form-group">
                                <label for="evento-hora-fin">Hora de fin</label>
                                <input type="time" id="evento-hora-fin" class="form-input" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="evento-ubicacion">Ubicación</label>
                            <input type="text" id="evento-ubicacion" class="form-input">
                        </div>
                        <div class="form-group">
                            <label for="evento-tipo">Tipo de Evento</label>
                            <select id="evento-tipo" class="form-select">
                                <option value="clase">Clase</option>
                                <option value="examen">Examen</option>
                                <option value="reunion">Reunión</option>
                                <option value="evento">Evento Especial</option>
                                <option value="otro">Otro</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="evento-notificar">Notificar a participantes</label>
                            <div class="checkbox-group">
                                <label>
                                    <input type="checkbox" id="evento-notificar" checked>
                                    Enviar notificación por correo
                                </label>
                            </div>
                        </div>
                        <div class="form-group" id="participantes-group">
                            <label for="evento-participantes">Participantes (separados por comas)</label>
                            <input type="text" id="evento-participantes" class="form-input" placeholder="correo1@escom.ipn.mx, correo2@escom.ipn.mx">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button id="btn-cancelar-evento" class="btn-reset">Cancelar</button>
                    <button id="btn-guardar-evento" class="btn-submit">Guardar Evento</button>
                </div>
            </div>
        </div>

        <!-- Modal de confirmación -->
        <div id="confirmacion-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="confirmacion-titulo">Confirmación</h3>
                    <span class="close-modal">&times;</span>
                </div>
                <div class="modal-body">
                    <p id="confirmacion-mensaje">¿Estás seguro de que deseas eliminar este evento?</p>
                </div>
                <div class="modal-footer">
                    <button id="btn-cancelar-confirmacion" class="btn-reset">Cancelar</button>
                    <button id="btn-aceptar-confirmacion" class="btn-submit">Aceptar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="agenda.js"></script>
</body>
</html>
